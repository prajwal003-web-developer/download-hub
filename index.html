<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
    <link rel="stylesheet" href="./style.css">

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white p-4 flex flex-col justify-center items-center h-[100dvh]">

    <div>
        
        <h3 class="text-4xl py-4 text-center font-semibold bg-gradient-to-l from-red-600 to-blue-700 bg-clip-text text-transparent ">Paste The URL Below:</h3>
        <div class="md:w-[30rem] w-full border border-solid rounded border-gray">
            
            <input  type="text" placeholder="Paste Your URL Here" class="p-2 w-full bg-transparent border-none outline-none">

        </div>
        <button onclick="HandleClick()" class="md:w-[30rem] w-full rounded-lg  py-2 my-3 bg-gradient-to-l from-red-600 to-blue-700 font-semibold">
            Download
        </button>
    </div>

    <div id="data" class="border border-blue-600 text-gray-300 font-semibold border-solid  p-3 rounded w-full md:w-[30rem] text-center">
        Your Download Status
    </div>
    <div id="link_Box" class="font-semibold rounded w-full md:w-[30rem] text-center">

    </div>

    <script src="./script.js"></script>
</body>
</html>
